<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Album Covers – Elias Olai Skog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header class="header">
    <nav class="wrap header-inner">
      <a href="../#arbeid" class="nav-link">WORK</a>
      <a href="../" class="logo"><img class="logo-standard" src="../assets/Top%20Logo_1.svg" alt="Elias Olai Skog – back to home"><img class="logo-hover" src="../assets/Top%20Logo_2.svg" alt="" aria-hidden="true"></a>
      <a href="#info" class="nav-link nav-right">INFO</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="project-hero">
      <a href="../#arbeid" class="back">← All projects</a>
      <h1 class="reveal">Album Covers</h1>
    </section>

    <div class="card-img reveal" style="aspect-ratio: 16/9">
      <img src="Prosjekt%204/web/thumbnail.jpg" alt="Album covers by Elias Olai Skog">
    </div>

    <section class="project-info">
      <div class="reveal">
        <p>A collection of album and single covers – some released with official songs and albums, others unreleased concepts.</p>
      </div>
      <ul class="facts reveal">
        <li><span>Type</span><span>Album &amp; single covers</span></li>
        <li><span>Year</span><span>2024–2026</span></li>
      </ul>
    </section>

    <!-- Coverne vises i rekkefølge 1–11. Nytt cover: legg til en ny <img>-linje. -->
    <section class="cover-grid">
        <img class="reveal" src="Prosjekt%204/web/cover-01.jpg" alt="Album cover 1" loading="lazy">
        <img class="reveal" src="Prosjekt%204/web/cover-02.jpg" alt="Album cover 2" loading="lazy">
        <img class="reveal" src="Prosjekt%204/web/cover-03.jpg" alt="Album cover 3" loading="lazy">
        <img class="reveal" src="Prosjekt%204/web/cover-04.jpg" alt="Album cover 4" loading="lazy">
        <img class="reveal" src="Prosjekt%204/web/cover-05.jpg" alt="Album cover 5" loading="lazy">
        <img class="reveal" src="Prosjekt%204/web/cover-06.jpg" alt="Album cover 6" loading="lazy">
        <img class="reveal" src="Prosjekt%204/web/cover-07.jpg" alt="Album cover 7" loading="lazy">
        <img class="reveal" src="Prosjekt%204/web/cover-08.jpg" alt="Album cover 8" loading="lazy">
        <img class="reveal" src="Prosjekt%204/web/cover-09.jpg" alt="Album cover 9" loading="lazy">
        <img class="reveal" src="Prosjekt%204/web/cover-10.jpg" alt="Album cover 10" loading="lazy">
        <img class="reveal" src="Prosjekt%204/web/cover-11.jpg" alt="Album cover 11" loading="lazy">
    </section>

  </main>

  <footer class="footer">
    <div class="wrap">
      <span>© <span data-year>2026</span> Elias Olai Skog</span>
      <a href="#">Back to top ↑</a>
    </div>
  </footer>

  <script src="../script.js"></script>
</body>
</html>
