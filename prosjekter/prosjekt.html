<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- MAL: Kopier denne filen for hvert prosjekt (f.eks. prosjektnavn.html) og bytt innholdet. -->
  <title>Project name – Elias Olai Skog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <header class="header">
    <nav class="wrap header-inner">
      <a href="../#arbeid" class="nav-link">WORK</a>
      <a href="../" class="logo"><img src="../assets/logo.svg" alt="Elias Olai Skog – back to home"></a>
      <a href="#info" class="nav-link nav-right">INFO</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="project-hero">
      <a href="../#arbeid" class="back">← All projects</a>
      <h1 class="reveal">Project name</h1>
    </section>

    <div class="card-img reveal" style="aspect-ratio: 16/9">
      <img src="../bilder/prosjekt-1.svg" alt="Main image">
    </div>

    <section class="project-info">
      <div class="reveal">
        <p>Short description of the project: the brief, who it was for, and the solution.</p>
      </div>
      <ul class="facts reveal">
        <li><span>Client</span><span>Client name</span></li>
        <li><span>Year</span><span>2026</span></li>
        <li><span>Deliverables</span><span>Logo, identity</span></li>
      </ul>
    </section>

    <!-- Bilder: bruk .pair for to bilder ved siden av hverandre, eller ett bilde i full bredde -->
    <section class="project-images">
      <div class="pair">
        <img class="reveal" src="../bilder/prosjekt-3.svg" alt="Detail 1">
        <img class="reveal" src="../bilder/prosjekt-4.svg" alt="Detail 2">
      </div>
      <img class="reveal" src="../bilder/prosjekt-2.svg" alt="Full-width image">
    </section>

  </main>

  <footer class="footer">
    <div class="wrap">
      <span>© <span data-year>2026</span> Elias Olai Skog</span>
      <a href="#">Back to top ↑</a>
    </div>
  </footer>

  <script src="../script.js"></script>
</body>
</html>
